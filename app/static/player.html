<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLDR Radio — The Console</title>
<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/design-tokens.css">
<link rel="stylesheet" href="styles/base.css">
<style>
  .console-grid { display: grid; grid-template-columns: var(--rail-w) 1fr; gap: var(--space-6); align-items: start; }
  @media (max-width: 900px) { .console-grid { grid-template-columns: 1fr; } }

  /* Library rail — one collapsible group per issue date. Days start collapsed
     (14 days x 3 editions is a lot of rail), so the header alone has to say what
     is inside: the date, how many, and a colour dot per edition. */
  .day-group { margin-bottom: var(--space-3); }
  .day-toggle {
    display: flex; align-items: center; gap: var(--space-3);
    width: 100%; padding: var(--space-2) 0;
    background: transparent; border: 0; border-radius: var(--r-sm);
    /* --ink-2, not the muted --ink-3 this started as: the header is now the only
       way into a collapsed day, and a control has to read like one (3.0:1 -> 8.0:1). */
    color: var(--ink-2); cursor: pointer; text-align: left;
  }
  .day-toggle:hover { color: var(--ink); }
  .day-toggle .chev {
    width: 13px; height: 13px; flex: none;
    fill: none; stroke: currentColor; stroke-width: 2.5;
    transition: transform 0.15s ease;
  }
  .day-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .day-toggle .day-date { color: inherit; white-space: nowrap; }
  .day-toggle .day-line { flex: 1; height: 1px; background: var(--rule-strong); }
  .day-dots { display: flex; gap: 4px; flex: none; }
  /* --st is set inline per dot from the edition catalog (see app.js). */
  .day-dots i { width: 7px; height: 7px; border-radius: var(--r-pill); background: var(--st, var(--ink-3)); }
  .day-toggle .day-count { color: inherit; opacity: 0.8; }
  .day-eps { padding-top: var(--space-2); }

  /* The day holding whatever is on the console — findable while still collapsed. */
  .day-group[data-playing="true"] .day-toggle { color: var(--signal); }
  .day-group[data-playing="true"] .day-line { background: var(--signal); opacity: 0.4; }

  .ep-row { position: relative; }
  .ep-card { display: block; text-decoration: none; margin-bottom: var(--space-3); }
  .ep-card[aria-current="true"] { border-color: var(--signal); box-shadow: inset 3px 0 0 var(--signal); }
  .ep-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
  .ep-title { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-md); }
  .ep-meta { margin-top: 6px; padding-right: 30px; }

  /* Delete lives outside the card's <a> (no interactive content inside a link) and is
     positioned over its bottom-right corner. Dimmed until hover, but never hidden —
     hover-only controls are undiscoverable and dead on touch. */
  .ep-del {
    position: absolute; right: var(--space-4); bottom: calc(var(--space-3) + var(--space-4));
    display: grid; place-items: center; width: 26px; height: 26px;
    padding: 0; background: transparent; cursor: pointer;
    border: 1px solid transparent; border-radius: var(--r-sm);
    color: var(--ink-3); opacity: 0.55;
    transition: opacity 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .ep-row:hover .ep-del { opacity: 1; }
  .ep-del:hover, .ep-del:focus-visible {
    opacity: 1; color: var(--err); border-color: var(--err); background: var(--err-tint);
  }
  .ep-del svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; }

  /* Now playing console */
  .now { padding: var(--space-6); border-radius: var(--r-lg); }
  .now-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-5); }
  .voice-chip {
    font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: 0.08em;
    padding: 4px 9px; border: 1px solid var(--console-rule); border-radius: var(--r-sm);
    color: var(--console-ink-2);
  }

  /* The tuner dial (signature) */
  .tuner {
    position: relative; height: 46px; margin: var(--space-4) 0;
    border: 1px solid var(--console-rule); border-radius: var(--r-md);
    background:
      repeating-linear-gradient(90deg, var(--console-ink-2) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(90deg, var(--console-ink) 0 2px, transparent 2px 110px);
    background-color: var(--console-2);
    cursor: ew-resize; touch-action: none;
    opacity: 0.9;
  }
  .tuner .needle {
    position: absolute; top: -6px; bottom: -6px; left: 6%;
    width: 3px; background: var(--signal); border-radius: var(--r-pill);
    box-shadow: 0 0 12px var(--signal); pointer-events: none;
  }
  .tuner .needle::after {
    content: ""; position: absolute; top: -5px; left: -4px;
    width: 11px; height: 11px; border-radius: var(--r-pill);
    background: var(--signal); box-shadow: 0 0 10px var(--signal);
  }
  canvas.vu { width: 100%; height: 66px; }

  .transport { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-4); flex-wrap: wrap; }
  .transport .spacer { flex: 1; }
  .time-readout { font-size: 1.6rem; }
  .time-readout .total { color: var(--console-ink-2); font-size: 1rem; }
  .speed {
    font-family: var(--font-mono); font-size: var(--fs-sm);
    background: var(--console-2); color: var(--console-ink);
    border: 1px solid var(--console-rule); border-radius: var(--r-md);
    padding: var(--space-2) var(--space-3);
  }

  /* Now-playing story — pinned directly under the transport so whatever is being
     read is always on screen, instead of drifting down the chapter list. */
  .now-chapter {
    margin-top: var(--space-5);
    padding: var(--space-4) var(--space-5);
    background: var(--console-2);
    border: 1px solid var(--console-rule);
    border-left: 3px solid var(--signal);
    border-radius: var(--r-md);
  }
  .nc-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
  .nc-head .nc-pos { color: var(--signal); white-space: nowrap; }
  .now-chapter h3 { font-size: var(--fs-lg); margin-top: var(--space-2); }
  .nc-source {
    margin-top: var(--space-3); max-width: none;
    font-size: var(--fs-sm); line-height: var(--lh-body); color: var(--console-ink-2);
    /* Long summaries scroll inside the card rather than pushing the list off-screen. */
    max-height: 13em; overflow-y: auto;
  }
  .nc-foot { display: flex; align-items: center; gap: var(--space-4); margin-top: var(--space-3); flex-wrap: wrap; }

  /* Chapters — note these sit ON the faceplate, so they take the console ink scale. */
  .chapters { margin-top: var(--space-6); }
  .chapter {
    display: grid; grid-template-columns: 30px 1fr auto; gap: var(--space-3);
    align-items: baseline; padding: var(--space-3) var(--space-3);
    border-radius: var(--r-md); cursor: pointer; border: 1px solid transparent;
  }
  .chapter:hover { background: var(--console-2); }
  /* Mixed against the faceplate, not --signal-tint: that token flips to a pale
     wash in Daytime and would erase the console-ink text sitting on it. */
  .chapter[data-current="true"] {
    background: color-mix(in srgb, var(--signal) 16%, var(--console-2));
    border-color: var(--signal);
  }
  .chapter .num { font-family: var(--font-mono); color: var(--console-ink-2); font-size: var(--fs-sm); }
  .chapter[data-current="true"] .num { color: var(--signal); }
  .chapter h4 { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-base); line-height: 1.25; }
  .chapter .side { display: flex; align-items: center; gap: var(--space-3); }
  .chapter details { margin-top: var(--space-2); }
  .chapter summary { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--console-ink-2); cursor: pointer; letter-spacing: 0.06em; }
  .chapter details p { font-size: var(--fs-sm); color: var(--console-ink-2); margin-top: var(--space-2); }
  .readmore { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--signal); text-decoration: none; white-space: nowrap; }

  /* On a phone the chapter row's third column (timing + read-more, both nowrap)
     cannot fit beside the headline — it forced the whole page wider than the
     viewport. Drop it onto its own line instead of scrolling the page sideways. */
  @media (max-width: 640px) {
    .now { padding: var(--space-5); }
    .chapter { grid-template-columns: 26px 1fr; }
    .chapter .side { grid-column: 2; margin-top: var(--space-2); }
    .now-chapter { padding: var(--space-4); }
    .nc-head { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header class="mast console">
  <div class="wrap mast-inner">
    <a class="wordmark" href="index.html"><span class="wm-dot"></span>TLDR <span class="wm-thin">RADIO</span></a>
    <nav class="mast-nav">
      <a href="index.html">The Desk</a>
      <a href="player.html" aria-current="page">Library</a>
      <a href="settings.html">Settings</a>
      <button class="theme-btn" data-theme-toggle aria-label="Toggle theme">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span data-theme-label>Daytime</span>
      </button>
    </nav>
  </div>
</header>

<main class="wrap page">
  <div class="console-grid">
    <!-- Library rail -->
    <aside>
      <p class="eyebrow">Library · 14-day retention</p>
      <div id="library"><p class="muted mono">Loading library…</p></div>
    </aside>

    <!-- Now playing console -->
    <section class="console now">
      <div class="now-head">
        <div>
          <p class="eyebrow">Now playing</p>
          <h2 id="ep-title">Select an episode</h2>
          <p class="mono muted" id="ep-sub"></p>
        </div>
        <span class="voice-chip" id="ep-voice">VOICE</span>
      </div>

      <div class="tuner" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="664" aria-valuenow="42">
        <span class="needle"></span>
      </div>
      <canvas class="vu" aria-hidden="true"></canvas>

      <div class="transport">
        <button class="icon-btn" aria-label="Previous chapter"><svg viewBox="0 0 24 24"><path d="M18 5v14M8 12l10-7v14z"/><path d="M6 5v14"/></svg></button>
        <button class="icon-btn" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24"><path d="M11 5 5 9l6 4V5z"/><path d="M8 9h6a5 5 0 1 1-5 5"/></svg></button>
        <button class="icon-btn primary" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="icon-btn" aria-label="Forward 15 seconds"><svg viewBox="0 0 24 24"><path d="M13 5l6 4-6 4V5z"/><path d="M16 9h-6a5 5 0 1 0 5 5"/></svg></button>
        <button class="icon-btn" aria-label="Next chapter"><svg viewBox="0 0 24 24"><path d="M6 5v14M16 12L6 5v14z"/><path d="M18 5v14"/></svg></button>
        <span class="spacer"></span>
        <span class="led time-readout mono"><span data-led>00:42</span><span class="total"> / 11:04</span></span>
        <select class="speed" aria-label="Playback speed">
          <option>0.75×</option><option>1.0×</option><option selected>1.25×</option>
          <option>1.5×</option><option>2.0×</option><option>2.5×</option>
        </select>
      </div>

      <article class="now-chapter" id="now-chapter" aria-live="polite" hidden>
        <div class="nc-head">
          <span class="eyebrow" id="nc-section"></span>
          <span class="mono nc-pos" id="nc-pos"></span>
        </div>
        <h3 id="nc-title"></h3>
        <p class="nc-source" id="nc-source"></p>
        <div class="nc-foot">
          <span class="mono muted" id="nc-meta"></span>
          <a class="readmore" id="nc-link" target="_blank" rel="noopener" hidden>read more ↗</a>
        </div>
      </article>

      <div class="chapters" id="chapters"></div>
    </section>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
